{{ define "main" }}
<section class="hero">
    <h1>{{ .Site.Title }}</h1>
    <p class="tagline">{{ .Site.Params.description }}</p>
</section>

<section class="posts">
    {{ range .Data.Pages }}
    <article class="post-card">
        <time>{{ .Date.Format "2006-01-02" }}</time>
        <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
        {{ with .Summary }}<p>{{ . | truncate 200 }}</p>{{ end }}
        {{ with .Params.tags }}
        <div class="tags">
            {{ range . }}<span class="tag">{{ . }}</span>{{ end }}
        </div>
        {{ end }}
    </article>
    {{ end }}
</section>
{{ end }}
